[package]
name = "latch-demo"
version = "0.1.0"
description = "Reference demo: split-control escrow walkthrough on devnet with signing ceremony and signature certificate"
edition.workspace = true
rust-version.workspace = true

[dependencies]
latch = { path = "../programs/latch" }
anchor-lang = { version = "1.2.0", features = ["event-cpi"] }
anchor-spl = "1.2.0"
solana-rpc-client = "3"
solana-keypair = "3.0.1"
solana-signer = "3.0.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
tiny_http = "0.12"
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
