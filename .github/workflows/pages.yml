name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "clients/ts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: app
        env:
          LATCH_PAGES: "1"
        run: npm ci && npm run build
      - name: Build SDK API docs
        working-directory: clients/ts
        run: npm ci && npm run docs --workspace @latch-labs/sdk
      - name: Add API docs to site at /api/
        run: mkdir -p app/dist/api && cp -R clients/ts/packages/sdk/docs/. app/dist/api/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
